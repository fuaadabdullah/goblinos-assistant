name: CI

# Quality gates for the backend. These must pass before any deploy
# (Render auto-deploys on commit, so this workflow is the only gate).
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests, lint & security audit
    runs-on: ubuntu-latest
    env:
      # Keep the test run hermetic: never emit telemetry from CI.
      DISABLE_OPENTELEMETRY: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to match Dockerfile.prod (python:3.11-slim).
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pip-audit

      - name: Lint (ruff)
        # Pin the root config: backend/pyproject.toml carries a stricter
        # dev-only rule set that ruff would otherwise prefer for this path.
        # The gate intentionally uses the conservative root config.
        run: ruff check backend/ --config pyproject.toml

      - name: Security audit (pip-audit)
        # Baseline ignores (2026-09-21): no fixed release exists upstream for
        # these (chromadb incl. PYSEC-2026-311 — the app only uses the embedded
        # PersistentClient, never the HTTP server; nltk), or the fix needs a
        # breaking major upgrade (transformers 5.x — tracked as upgrade debt).
        # The gate still fails on any new vulnerability. Revisit the ignores
        # when upstream ships fixes.
        run: >-
          pip-audit
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3740
          --ignore-vuln PYSEC-2025-217
          --ignore-vuln PYSEC-2026-2288
          --ignore-vuln PYSEC-2026-2289
          --ignore-vuln PYSEC-2026-2290
          --ignore-vuln PYSEC-2026-3929

      - name: Tests with coverage
        # Initial coverage floor is intentionally modest: the suite is still
        # growing (see H11). Raise --cov-fail-under as coverage improves.
        run: >
          python -m pytest
          --cov=backend
          --cov-report=term-missing
          --cov-fail-under=15
