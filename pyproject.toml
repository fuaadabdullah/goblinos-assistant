[tool.pytest.ini_options]
# All tests live under backend/tests/ (unit + integration).
testpaths = ["backend/tests"]
# Ensure `import backend...` resolves no matter where pytest is invoked from.
pythonpath = ["."]
# Async tests opt in explicitly via @pytest.mark.asyncio (pytest-asyncio
# is installed); strict mode keeps unmarked coroutine tests as errors.
asyncio_mode = "strict"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Conservative error-level gate: catches real bugs (undefined names,
# syntax-level errors, pyflakes issues) without failing on style nits
# across the legacy tree. The ignored rules below are known legacy debt
# with low signal (same rationale as F401). Tighten the selection as
# debt is cleaned up.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "F401",  # unused imports
    "E402",  # module import not at top of file (conditional/sys.path imports)
    "F841",  # unused local variable
    "F541",  # f-string without placeholders
    "E712",  # comparison to True/False
    "E713",  # test for membership should be `not in`
]

[tool.ruff.lint.per-file-ignores]
# Dead legacy module: superseded by the split-out chat_* component modules and
# not importable (forward references to names defined later in the file would
# raise NameError at import time). Tracked as debt; excluded from the gate.
"backend/services/chat_handler.py" = ["F821", "F811"]
